<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rad van Fortuin</title>
<style>
  :root {
    --bg: #14121f; --panel: #1f1c2e; --line: #34304a; --text: #f3f1fa;
    --muted: #a09bb8; --accent: #ffc83d; --accent-text: #2a1e00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px;
    display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr) minmax(0, 400px);
    align-items: start;
  }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }

  .stage { text-align: center; }
  .wheel-wrap { position: relative; max-width: 560px; margin: 0 auto; }
  canvas { width: 100%; height: auto; display: block; cursor: pointer; }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border: 16px solid transparent; border-top: 30px solid var(--accent);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); z-index: 2;
  }
  #result {
    min-height: 44px; margin: 14px 0 10px; font-size: 28px; font-weight: 700;
    overflow-wrap: anywhere;
  }
  button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  #spin {
    background: var(--accent); color: var(--accent-text); border: 0;
    font-size: 20px; font-weight: 700; padding: 14px 44px; border-radius: 999px;
  }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .head, .row {
    display: grid; grid-template-columns: 14px minmax(0, 1fr) 118px 44px 32px;
    gap: 8px; align-items: center;
  }
  .head { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .row { margin-bottom: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; }
  input[type=text], input[type=number] {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px; width: 100%; min-width: 0;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .weight { display: grid; grid-template-columns: 32px minmax(0, 1fr) 32px; gap: 4px; }
  .weight button, .del { padding: 8px 0; text-align: center; }
  .weight input { text-align: center; padding: 8px 2px; -moz-appearance: textfield; }
  .weight input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .pct { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .del { color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .opts { margin-top: 14px; display: grid; gap: 8px; font-size: 14px; }
  .opts label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .hint { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
</style>
</head>
<body>
<main>
  <section class="stage">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="1000" height="1000" aria-label="Rad van fortuin"></canvas>
    </div>
    <div id="result" aria-live="polite"></div>
    <button id="spin">Draai!</button>
  </section>

  <section class="panel">
    <h1>Rad van Fortuin</h1>
    <p class="sub">Hoger gewicht = grotere kans. Gewicht 0 doet niet mee.</p>
    <div class="head"><span></span><span>Woord</span><span style="text-align:center">Gewicht</span><span style="text-align:right">Kans</span><span></span></div>
    <div id="rows"></div>
    <div class="actions">
      <button id="add">+ Woord</button>
      <button id="share">Kopieer deellink</button>
      <button id="reset">Gewichten naar 1</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="equal"> Toon alle vakken even groot (gewichten verborgen)</label>
      <label><input type="checkbox" id="remove"> Zet winnaar na het draaien op gewicht 0</label>
    </div>
    <p class="hint">Alles wordt automatisch bewaard in deze browser. Met de deellink opent iemand anders het rad met precies dezelfde woorden en gewichten.</p>
  </section>
</main>

<script>
const COLORS = ['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#0f9d9d','#d4a017','#c2185b','#5b7c0a','#7b5cff','#b3541e','#1e88e5'];
const KEY = 'rad-van-fortuin-v1';
const DEFAULT = { items: [
  {t:'Pizza',w:3},{t:'Sushi',w:2},{t:'Pasta',w:2},{t:'Burger',w:1},{t:'Salade',w:1},{t:'Friet',w:1}
], equal:false, remove:false };

let state = load();
let rot = 0, spinning = false;

const $ = id => document.getElementById(id);
const canvas = $('wheel'), ctx = canvas.getContext('2d');

function clean(s) {
  if (!s || !Array.isArray(s.items)) return null;
  return {
    items: s.items.slice(0, 200).map(i => ({ t: String(i.t ?? '').slice(0, 60), w: Math.max(0, Number(i.w) || 0) })),
    equal: !!s.equal, remove: !!s.remove
  };
}
function load() {
  try {
    if (location.hash.startsWith('#d=')) {
      const s = clean(JSON.parse(decodeURIComponent(location.hash.slice(3))));
      if (s) return s;
    }
  } catch {}
  try { const s = clean(JSON.parse(localStorage.getItem(KEY))); if (s) return s; } catch {}
  return structuredClone(DEFAULT);
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  try { history.replaceState(null, '', '#d=' + encodeURIComponent(JSON.stringify(state))); } catch {}
}

// Actieve vakken: alleen woorden met gewicht > 0
function active() {
  return state.items.map((it, i) => ({ ...it, i })).filter(it => it.w > 0);
}
function slices() {
  const a = active();
  const total = a.reduce((s, it) => s + (state.equal ? 1 : it.w), 0);
  let at = 0;
  return a.map(it => {
    const size = (state.equal ? 1 : it.w) / total * Math.PI * 2;
    const s = { ...it, start: at, end: at + size };
    at += size;
    return s;
  });
}

function draw() {
  const R = 500, r = 480;
  ctx.clearRect(0, 0, 1000, 1000);
  const sl = slices();
  ctx.save();
  ctx.translate(R, R);
  ctx.rotate(rot);
  if (!sl.length) {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = '#2a2640'; ctx.fill();
  }
  for (const s of sl) {
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, s.start, s.end); ctx.closePath();
    ctx.fillStyle = COLORS[s.i % COLORS.length]; ctx.fill();
    ctx.strokeStyle = '#14121f'; ctx.lineWidth = 4; ctx.stroke();
    // Tekst langs de straal
    const span = s.end - s.start, mid = s.start + span / 2;
    const maxH = Math.min(46, 2 * 300 * Math.sin(Math.min(span, Math.PI) / 2) * 0.8);
    if (maxH < 12) continue;
    ctx.save();
    ctx.rotate(mid);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    let size = maxH, label = s.t || '—';
    ctx.font = `700 ${size}px system-ui, sans-serif`;
    const maxW = 340;
    while (ctx.measureText(label).width > maxW && size > 18) { size -= 2; ctx.font = `700 ${size}px system-ui, sans-serif`; }
    while (ctx.measureText(label).width > maxW && label.length > 2) label = label.slice(0, -2) + '…';
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 6;
    ctx.fillText(label, r - 24, 0);
    ctx.restore();
  }
  ctx.restore();
  // Rand en naaf
  ctx.beginPath(); ctx.arc(R, R, r, 0, Math.PI * 2); ctx.strokeStyle = '#ffc83d'; ctx.lineWidth = 12; ctx.stroke();
  ctx.beginPath(); ctx.arc(R, R, 46, 0, Math.PI * 2); ctx.fillStyle = '#14121f'; ctx.fill();
  ctx.lineWidth = 8; ctx.stroke();
}

function renderRows() {
  const rows = $('rows');
  rows.innerHTML = '';
  state.items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span class="dot" style="background:${COLORS[i % COLORS.length]}"></span>
      <input type="text" maxlength="60" placeholder="Woord" aria-label="Woord">
      <span class="weight">
        <button data-d="-1" aria-label="Gewicht omlaag">−</button>
        <input type="number" min="0" step="1" inputmode="decimal" aria-label="Gewicht">
        <button data-d="1" aria-label="Gewicht omhoog">+</button>
      </span>
      <span class="pct"></span>
      <button class="del" aria-label="Verwijder">✕</button>`;
    const [text, num] = row.querySelectorAll('input');
    text.value = it.t; num.value = it.w;
    text.oninput = () => { it.t = text.value; changed(); };
    num.oninput = () => { it.w = Math.max(0, Number(num.value) || 0); changed(); };
    row.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
      it.w = Math.max(0, Math.round((it.w + Number(b.dataset.d)) * 100) / 100);
      num.value = it.w; changed();
    });
    row.querySelector('.del').onclick = () => { state.items.splice(i, 1); renderRows(); changed(); };
    rows.appendChild(row);
  });
  updatePct();
}
function updatePct() {
  const total = state.items.reduce((s, it) => s + it.w, 0);
  document.querySelectorAll('#rows .pct').forEach((el, i) => {
    const p = total ? state.items[i].w / total * 100 : 0;
    el.textContent = (p >= 10 || p === 0 ? p.toFixed(0) : p.toFixed(1)) + '%';
  });
  $('spin').disabled = spinning || !active().length;
}
function changed() { save(); updatePct(); draw(); }

function spin() {
  if (spinning) return;
  const sl = slices();
  if (!sl.length) return;
  // Winnaar kiezen op basis van gewicht (los van hoe groot het vak getekend is)
  let x = Math.random() * sl.reduce((s, it) => s + it.w, 0);
  const win = sl.find(s => (x -= s.w) < 0) || sl[sl.length - 1];
  const span = win.end - win.start;
  const target = win.start + span * (0.1 + Math.random() * 0.8);
  const TAU = Math.PI * 2;
  let delta = ((-Math.PI / 2 - target - rot) % TAU + TAU) % TAU;
  delta += TAU * (5 + Math.floor(Math.random() * 3));
  const from = rot, dur = 5500, t0 = performance.now();
  spinning = true; $('result').textContent = ''; updatePct();
  (function frame(now) {
    const t = Math.min(1, (now - t0) / dur);
    rot = from + delta * (1 - Math.pow(1 - t, 4));
    draw();
    if (t < 1) return requestAnimationFrame(frame);
    rot %= TAU; spinning = false;
    $('result').textContent = '🎉 ' + (win.t || '—');
    if (state.remove) { state.items[win.i].w = 0; renderRows(); save(); }
    updatePct();
  })(t0);
}

$('spin').onclick = spin;
canvas.onclick = spin;
$('add').onclick = () => {
  state.items.push({ t: '', w: 1 }); renderRows(); changed();
  const inputs = document.querySelectorAll('#rows input[type=text]');
  inputs[inputs.length - 1].focus();
};
$('reset').onclick = () => { state.items.forEach(it => it.w = 1); renderRows(); changed(); };
$('share').onclick = async () => {
  save();
  const b = $('share');
  try { await navigator.clipboard.writeText(location.href); b.textContent = 'Link gekopieerd ✓'; }
  catch { prompt('Kopieer deze link:', location.href); }
  setTimeout(() => b.textContent = 'Kopieer deellink', 1800);
};
$('equal').checked = state.equal; $('remove').checked = state.remove;
$('equal').onchange = e => { state.equal = e.target.checked; changed(); };
$('remove').onchange = e => { state.remove = e.target.checked; changed(); };

renderRows(); draw();
</script>
</body>
</html>
