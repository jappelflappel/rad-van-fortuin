<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181a" media="(prefers-color-scheme: dark)">
<title>Rad van Fortuin</title>
<meta name="description" content="Een rad van fortuin waarbij je per woord het gewicht instelt en het rad met een link deelt.">
<style>
:root {
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
  --bg: #f5f5f7;
  --bar: rgba(245, 245, 247, .82);
  --surface: #fff;
  --ink: #1d1d1f;
  --secondary: #656569;
  --separator: #e5e5e9;
  --fill: #ededf0;
  --pressed: #e0e0e5;
  --switch-thumb: #fff;
  --action: #252527;
  --action-ink: #fff;
  --accent: #086ac8;
  --pointer: #35363a;
  --wheel-rim: #fdfdfe;
  --wheel-edge: #cacdd3;
  --wheel-line: #f5f5f7;
  --wheel-ink: #252830;
  --wheel-highlight: #bfd4ea;
  --wheel-hub: #f8f9fb;
  --wedge-1: #d8dde6;
  --wedge-2: #f0f1f4;
  --wedge-3: #cbd1db;
  --wedge-4: #e9ebf0;
  --wedge-5: #d7dbe2;
  --wedge-6: #f1f2f5;
  --wedge-7: #cfd4de;
  --wedge-8: #e8ebf0;
  --wheel-shadow: 0 1px 2px #161a2310, 0 18px 40px #252a381a;
  --radius: 1.125rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18181a;
    --bar: rgba(24, 24, 26, .82);
    --surface: #242427;
    --ink: #f5f5f7;
    --secondary: #acacb2;
    --separator: #39393e;
    --fill: #323236;
    --pressed: #414146;
    --switch-thumb: #d8d8dc;
    --action: #ececf0;
    --action-ink: #202023;
    --accent: #83bbfa;
    --pointer: #ececf0;
    --wheel-rim: #41444c;
    --wheel-edge: #555963;
    --wheel-line: #282b31;
    --wheel-ink: #f1f2f6;
    --wheel-highlight: #405a79;
    --wheel-hub: #474b54;
    --wedge-1: #3b404b;
    --wedge-2: #505560;
    --wedge-3: #343944;
    --wedge-4: #484d58;
    --wedge-5: #3a3f48;
    --wedge-6: #50545f;
    --wedge-7: #363c47;
    --wedge-8: #484d57;
    --wheel-shadow: 0 1px 2px #0003, 0 18px 40px #0005;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scroll-padding-top: 4.5rem; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button, summary { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
::selection { background: var(--wheel-highlight); color: var(--ink); }
.wrap { width: min(100% - 4rem, 72rem); margin-inline: auto; }

.bar {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--bg);
}
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  .bar {
    background: var(--bar);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    backdrop-filter: blur(22px) saturate(160%);
  }
}
.bar .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: 4rem;
  padding-block: .5rem;
}
h1, h2, #result { margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
h1 { font-size: 1.1875rem; font-weight: 650; line-height: 1.18; letter-spacing: -.025em; }
h2 { font-size: 1.5rem; font-weight: 650; line-height: 1.15; letter-spacing: -.027em; }
.icon { display: block; width: 1.125rem; height: 1.125rem; flex: none; }
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  min-height: 2.75rem;
  padding: .5rem 1rem;
  border: 0;
  border-radius: 99rem;
  background: var(--fill);
  font-size: .875rem;
  font-weight: 600;
  transition: background-color 160ms ease, scale 180ms cubic-bezier(.2, .7, .3, 1);
}
@media (hover: hover) {
  .button:hover:not(:disabled), .weight button:hover, .del:hover { background: var(--pressed); }
}
.button:active:not(:disabled) { scale: .96; transition-duration: 80ms; }
#share { position: relative; flex: none; min-width: 9.25rem; }
#share .copied-icon, #share[data-copied] .share-icon { display: none; }
#share[data-copied] .copied-icon { display: block; }

main.wrap {
  display: grid;
  grid-template-columns: minmax(0, 1.52fr) minmax(21rem, 1fr);
  gap: clamp(2rem, 5vw, 5rem);
  align-items: start;
  padding-block: 2rem 4rem;
}
.stage {
  min-width: 0;
  display: grid;
  justify-items: center;
  gap: 1.5rem;
  padding-top: .75rem;
  text-align: center;
}
.wheel-wrap {
  position: relative;
  isolation: isolate;
  width: min(100%, 33rem, max(18rem, calc(100svh - 15rem)));
  aspect-ratio: 1;
}
.wheel-wrap::before {
  content: "";
  position: absolute;
  inset: 1.3%;
  z-index: -1;
  border-radius: 50%;
  box-shadow: var(--wheel-shadow);
  pointer-events: none;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 50%;
  cursor: pointer;
  touch-action: manipulation;
}
.stage[data-spinning] canvas { will-change: transform; }
.stage[data-empty] canvas { cursor: default; }
.pointer {
  position: absolute;
  top: -.6%;
  left: 50%;
  z-index: 1;
  width: 4.9%;
  height: auto;
  transform: translateX(-50%);
  color: var(--pointer);
  pointer-events: none;
}
.playbar { display: grid; justify-items: center; gap: .75rem; width: 100%; }
#spin {
  min-width: 10rem;
  min-height: 3rem;
  padding-inline: 1.25rem;
  background: var(--action);
  color: var(--action-ink);
  font-size: 1rem;
}
@media (hover: hover) {
  #spin:hover:not(:disabled) { background: color-mix(in srgb, var(--action) 88%, var(--action-ink)); }
}
#spin:disabled { background: var(--fill); color: var(--secondary); }
#result {
  min-width: 0;
  min-height: 1.5em;
  max-width: min(100%, 32rem);
  font-size: 1.625rem;
  font-weight: 650;
  line-height: 1.18;
  letter-spacing: -.025em;
}
#result.idle, #result.is-spinning {
  min-height: 1.625rem;
  color: var(--secondary);
  font-size: .875rem;
  font-weight: 400;
  letter-spacing: 0;
  line-height: 1.5;
}

.side { min-width: 0; }
.editor { display: grid; gap: 1.125rem; min-width: 0; }
.group-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  column-gap: .75rem;
  margin-bottom: .25rem;
}
.link {
  min-height: 2.75rem;
  padding: .25rem 0;
  border: 0;
  border-radius: .375rem;
  background: transparent;
  color: var(--secondary);
  font-size: .8125rem;
}
.link:hover { color: var(--ink); }
.list, .settings { border-radius: var(--radius); background: var(--surface); }
.table-head, .row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 6.25rem 2.75rem 2.5rem;
  align-items: center;
  gap: .5rem;
  padding-inline: .75rem;
}
.table-head { padding-block: .75rem .5rem; color: var(--secondary); font-size: .75rem; }
.table-head span:nth-child(2) { text-align: center; }
.table-head span:last-child, .pct { text-align: right; }
.row { min-height: 3.375rem; padding-block: .25rem; border-top: 1px solid var(--separator); }
.word { display: grid; grid-template-columns: .5rem minmax(0, 1fr); align-items: center; gap: .5rem; }
.dot { width: .5rem; height: .5rem; border: 1px solid var(--wheel-edge); border-radius: 50%; }
.row textarea {
  display: block;
  width: 100%;
  min-height: 2.25rem;
  padding: .5rem .1875rem;
  border: 0;
  border-radius: .375rem;
  background: transparent;
  resize: none;
  overflow: hidden;
  line-height: 1.3;
}
.row textarea::placeholder { color: var(--secondary); }
.row textarea:hover, .row textarea:focus { background: var(--bg); }
.row textarea:focus-visible, .weight input:focus-visible { outline-offset: -2px; }
.weight {
  display: grid;
  grid-template-columns: 1.9375rem minmax(0, 1fr) 1.9375rem;
  align-items: center;
  min-height: 2.25rem;
  border-radius: .5rem;
  background: var(--fill);
}
.weight button, .del {
  min-height: 2.25rem;
  padding: 0;
  border: 0;
  border-radius: .5rem;
  background: transparent;
  color: var(--secondary);
  line-height: 1;
}
.weight button { font-size: 1.125rem; }
.weight button:active, .del:active { background: var(--pressed); }
.weight input {
  min-width: 0;
  width: 100%;
  height: 2rem;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: center;
  font-variant-numeric: tabular-nums;
  appearance: textfield;
}
.weight input::-webkit-inner-spin-button, .weight input::-webkit-outer-spin-button { appearance: none; margin: 0; }
.pct { color: var(--secondary); font-size: .8125rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.del { display: grid; place-items: center; width: 100%; min-height: 2.75rem; }
.del .icon { width: .75rem; height: .75rem; }
.add {
  display: flex;
  align-items: center;
  gap: .5rem;
  width: 100%;
  min-height: 2.875rem;
  padding: .5rem .875rem;
  border: 0;
  border-top: 1px solid var(--separator);
  border-radius: 0 0 var(--radius) var(--radius);
  background: transparent;
  text-align: left;
  font-size: .875rem;
  font-weight: 600;
}
.add:hover { background: var(--fill); }
.add .icon { width: .9375rem; height: .9375rem; }
.note { margin: .5rem .75rem 0; color: var(--secondary); font-size: .8125rem; line-height: 1.5; }
.settings summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: 3rem;
  padding: .625rem .875rem;
  border-radius: var(--radius);
  font-size: .9375rem;
  font-weight: 600;
  list-style: none;
}
.settings summary::-webkit-details-marker { display: none; }
.settings summary::after {
  content: "";
  width: .4375rem;
  height: .4375rem;
  margin-right: .3125rem;
  border-right: 1.5px solid var(--secondary);
  border-bottom: 1.5px solid var(--secondary);
  transform: rotate(-45deg);
  transition: transform 180ms ease;
}
.settings[open] summary { border-radius: var(--radius) var(--radius) 0 0; }
.settings[open] summary::after { transform: rotate(45deg); }
.opt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: 3rem;
  padding: .5rem .875rem;
  border-top: 1px solid var(--separator);
  cursor: pointer;
  font-size: .875rem;
}
.opt input {
  flex: none;
  position: relative;
  width: 2.5rem;
  height: 1.5rem;
  margin: 0;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 2rem;
  background: var(--pressed);
  cursor: inherit;
  appearance: none;
  transition: background-color 180ms ease;
}
.opt input::before {
  content: "";
  position: absolute;
  inset: .125rem auto auto .125rem;
  width: 1.125rem;
  height: 1.125rem;
  border-radius: 50%;
  background: var(--switch-thumb);
  box-shadow: 0 1px 3px #0003;
  transition: transform 220ms cubic-bezier(.2, .7, .3, 1);
}
.opt input:checked { background: var(--action); }
.opt input:checked::before { transform: translateX(1rem); background: var(--action-ink); }
.settings .note { margin: 0; padding: .625rem .875rem .875rem; border-top: 1px solid var(--separator); }
.noscript { padding-block: 1rem; color: var(--secondary); }

#delete-dialog {
  width: min(100% - 2rem, 23rem);
  padding: 1.25rem;
  border: 0;
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1rem 3rem #0003;
}
#delete-dialog::backdrop { background: #0005; }
#delete-dialog h2 { font-size: 1.25rem; }
#delete-dialog p { margin: .5rem 0 1rem; color: var(--secondary); overflow-wrap: anywhere; }
.dialog-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.dialog-actions .button { flex: 1; }
.dialog-actions [value="delete"] { background: var(--action); color: var(--action-ink); }
@media (hover: hover) {
  .dialog-actions [value="delete"]:hover {
    background: color-mix(in srgb, var(--action) 88%, var(--action-ink));
  }
}

@media (max-width: 51rem), (pointer: coarse) and (max-width: 64rem) {
  .wrap { width: min(100% - 2.5rem, 36rem); }
  main.wrap {
    --bar-min-height: 4rem;
    grid-template-columns: minmax(0, 1fr);
    gap: 1.5rem;
    padding-block: 1rem 3rem;
  }
  .stage {
    min-block-size: calc(100vh - var(--bar-min-height) - 1rem);
    min-block-size: calc(100lvh - var(--bar-min-height) - 1rem);
    align-content: center;
    gap: 1.25rem;
  }
  .wheel-wrap { width: min(100%, 29rem, max(8rem, calc(100svh - 13rem))); }
}
@media (max-width: 29rem) {
  .wrap { width: calc(100% - 2rem); }
  main.wrap { --bar-min-height: 3.75rem; }
  .bar .wrap { min-height: 3.75rem; }
  #share { min-width: 2.75rem; padding-inline: .75rem; }
  .share-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #share[data-copied] .share-label {
    inset: calc(100% + .375rem) 0 auto auto;
    width: max-content;
    height: auto;
    padding: .375rem .625rem;
    border-radius: .5rem;
    background: var(--surface);
    box-shadow: 0 2px 10px #0002;
    clip-path: none;
  }
  .table-head, .row {
    grid-template-columns: minmax(0, 1fr) 5.5rem 2.375rem 2.25rem;
    gap: .3125rem;
    padding-inline: .5rem;
  }
  .word { gap: .3125rem; }
  .weight { grid-template-columns: 1.6875rem minmax(0, 1fr) 1.6875rem; }
  #result { font-size: 1.375rem; }
  #result.idle, #result.is-spinning { font-size: .875rem; }
}
@media (max-width: 24rem) {
  .table-head { display: none; }
  .row {
    grid-template-columns: 7rem minmax(0, 1fr) 2.75rem;
    grid-template-areas: "word word delete" "weight chance delete";
    gap: .125rem .625rem;
    padding: .375rem .625rem .625rem .75rem;
  }
  .row:first-child { border-top: 0; }
  .word { grid-area: word; }
  .weight { grid-area: weight; grid-template-columns: 2.25rem minmax(0, 1fr) 2.25rem; }
  .pct { grid-area: chance; text-align: left; }
  .del { grid-area: delete; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; }
}
@media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
  .bar { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .list, .settings { outline: 1px solid var(--separator); }
}
@media (forced-colors: active) {
  .pointer { color: CanvasText; }
  .opt input { appearance: auto; width: 1.5rem; }
  .opt input::before { display: none; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <h1>Rad van Fortuin</h1>
    <button type="button" class="button" id="share">
      <svg class="icon share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14V3m-4 4 4-4 4 4m1.5 3.5H19a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19v-7A1.5 1.5 0 0 1 5 10.5h1.5"/></svg>
      <svg class="icon copied-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg>
      <span class="share-label" id="share-label" aria-live="polite">Kopieer link</span>
    </button>
  </div>
</header>

<noscript><p class="wrap noscript">Schakel JavaScript in om het rad te gebruiken.</p></noscript>

<main class="wrap">
  <section class="stage" aria-label="Het rad">
    <div class="wheel-wrap">
      <canvas id="wheel" width="1000" height="1000" role="img" aria-label="Rad van fortuin"></canvas>
      <svg class="pointer" viewBox="0 0 32 35" aria-hidden="true"><path fill="currentColor" d="M5 3h22a3 3 0 0 1 2.6 4.5L18.6 29a3 3 0 0 1-5.2 0L2.4 7.5A3 3 0 0 1 5 3Z"/></svg>
    </div>
    <div class="playbar">
      <button type="button" class="button" id="spin" disabled>Draai</button>
      <p id="result" class="idle" role="status" aria-atomic="true"></p>
    </div>
  </section>

  <section class="side" aria-labelledby="words-title">
    <div class="editor" id="editor">
      <div>
        <div class="group-head">
          <h2 id="words-title">Woorden</h2>
          <button type="button" class="link" id="reset">Gewichten naar 1</button>
        </div>
        <div class="list">
          <div class="table-head" aria-hidden="true"><span>Woord</span><span>Gewicht</span><span>Kans</span></div>
          <div id="rows"></div>
          <button type="button" class="add" id="add">
            <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11"/></svg>
            Voeg woord toe
          </button>
        </div>
        <p class="note">Een hoger gewicht geeft meer kans. Woorden met gewicht 0 doen niet mee.</p>
      </div>
      <details class="settings" id="settings">
        <summary>Instellingen</summary>
        <label class="opt"><span>Alle vakken even groot</span><input type="checkbox" id="equal" role="switch" aria-describedby="equal-note"></label>
        <label class="opt"><span>Winnaar daarna op gewicht 0</span><input type="checkbox" id="remove" role="switch"></label>
        <p class="note" id="equal-note">De gewichten bepalen de kans, ook bij gelijke vakken.</p>
      </details>
    </div>
  </section>
</main>

<dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-word">
  <form method="dialog">
    <h2 id="delete-title">Woord verwijderen?</h2>
    <p id="delete-word"></p>
    <div class="dialog-actions">
      <button type="submit" class="button" value="cancel" autofocus>Annuleer</button>
      <button type="submit" class="button" value="delete">Verwijder</button>
    </div>
  </form>
</dialog>

<script>
const KEY = 'rad-van-fortuin-v1';
const DEFAULT = { items: [
  {t:'Pizza',w:3},{t:'Sushi',w:2},{t:'Pasta',w:2},{t:'Burger',w:1},{t:'Salade',w:1},{t:'Friet',w:1}
], equal:false, remove:false };

const styles = getComputedStyle(document.documentElement);
const token = name => styles.getPropertyValue(name).trim();
const FONT = token('--font');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
const WEDGES = Array.from({ length: 8 }, (_, i) => '--wedge-' + (i + 1));
const TAU = Math.PI * 2;

let state = load();
let rot = Math.PI / 2 - 0.2;
let paintedRotation = 0;
let angularVelocity = 0;
let spinFrame = 0;
let selected = null;
let pendingDelete = null;

const $ = id => document.getElementById(id);
const canvas = $('wheel'), ctx = canvas.getContext('2d');
const stage = canvas.closest('.stage');
const spinButton = $('spin');
const result = $('result');
const deleteDialog = $('delete-dialog');

// Laatste vak krijgt een andere kleur als het anders naast dezelfde kleur zou liggen
function wedge(i) {
  const n = state.items.length, m = WEDGES.length;
  return n > 1 && i === n - 1 && i % m === 0 ? 2 : i % m;
}

function clean(s) {
  if (!s || !Array.isArray(s.items)) return null;
  return {
    items: s.items.slice(0, 200).map(i => ({ t: String(i.t ?? '').slice(0, 120), w: Math.max(0, Number(i.w) || 0) })),
    equal: !!s.equal, remove: !!s.remove
  };
}
function load() {
  try {
    if (location.hash.startsWith('#d=')) {
      const s = clean(JSON.parse(decodeURIComponent(location.hash.slice(3))));
      if (s) return s;
    }
  } catch {}
  try { const s = clean(JSON.parse(localStorage.getItem(KEY))); if (s) return s; } catch {}
  return structuredClone(DEFAULT);
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  const hash = '#d=' + encodeURIComponent(JSON.stringify(state));
  try { history.replaceState(null, '', hash); } catch {}
  return hash;
}

// Actieve vakken: alleen woorden met gewicht > 0
function active() {
  return state.items.map((it, i) => ({ ...it, i })).filter(it => it.w > 0);
}
function slices() {
  const a = active();
  const total = a.reduce((s, it) => s + (state.equal ? 1 : it.w), 0);
  let at = 0;
  return a.map(it => {
    const size = (state.equal ? 1 : it.w) / total * Math.PI * 2;
    const s = { ...it, start: at, end: at + size };
    at += size;
    return s;
  });
}

// Tekst in regels breken die binnen maxW passen (te lange woorden worden gesplitst)
function wrapText(text, maxW) {
  const lines = [];
  let line = '';
  for (let word of text.trim().split(/\s+/)) {
    while (ctx.measureText(word).width > maxW && word.length > 1) {
      let k = word.length - 1;
      while (k > 1 && ctx.measureText((line ? line + ' ' : '') + word.slice(0, k)).width > maxW) k--;
      if (line && ctx.measureText(line + ' ' + word.slice(0, k)).width > maxW) { lines.push(line); line = ''; continue; }
      lines.push((line ? line + ' ' : '') + word.slice(0, k)); line = ''; word = word.slice(k);
    }
    const test = line ? line + ' ' + word : word;
    if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = word; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
// Grootste lettergrootte waarbij de (meerregelige) tekst in het vak past
function fitLabel(text, span, outer) {
  const MAXW = 282, MIN = 18;
  const setFont = size => ctx.font = `600 ${size}px ${FONT}`;
  const room = (widest) => span >= Math.PI ? Infinity : 2 * (outer - widest) * Math.sin(span / 2) - 16;
  if (room(0) < MIN * 1.14) return null;
  for (let size = 46; size >= MIN; size -= 1) {
    setFont(size);
    const lines = wrapText(text, MAXW), lineH = size * 1.14;
    const widest = Math.max(...lines.map(l => ctx.measureText(l).width));
    if (lines.length * lineH <= room(widest)) return { size, lines, lineH };
  }
  // Past niet: op de kleinste grootte inkorten
  setFont(MIN);
  const lineH = MIN * 1.14, all = wrapText(text, MAXW);
  const widest = Math.max(...all.map(l => ctx.measureText(l).width));
  const max = Math.floor(room(widest) / lineH);
  if (max < 1) return null;
  const lines = all.slice(0, max);
  if (all.length > max) lines[max - 1] = lines[max - 1].replace(/.{0,2}$/, '…');
  return { size: MIN, lines, lineH };
}

function disk(radius, fill) {
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, TAU);
  ctx.fillStyle = fill;
  ctx.fill();
}

function ring(radius, width, stroke) {
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, TAU);
  ctx.lineWidth = width;
  ctx.strokeStyle = stroke;
  ctx.stroke();
}

function draw() {
  const center = canvas.width / 2;
  const face = 466;
  const labelEdge = face - 39;
  const sl = slices();
  paintedRotation = rot;
  canvas.style.transform = '';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(center, center);

  disk(486, token('--wheel-rim'));
  ring(486, 1.5, token('--wheel-edge'));
  disk(face, token('--wedge-1'));

  ctx.save();
  ctx.rotate(rot);
  for (const slice of sl) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, face, slice.start, slice.end);
    ctx.closePath();
    ctx.fillStyle = token(slice.i === selected ? '--wheel-highlight' : WEDGES[wedge(slice.i)]);
    ctx.fill();
    if (sl.length > 1) {
      ctx.lineWidth = 3;
      ctx.strokeStyle = token('--wheel-line');
      ctx.stroke();
    }
  }

  for (const slice of sl) {
    const span = slice.end - slice.start;
    const fit = fitLabel(slice.t.trim() || '—', span, labelEdge);
    if (!fit) continue;
    const angle = slice.start + span / 2;
    const flip = Math.cos(angle + rot) < 0;
    ctx.save();
    ctx.rotate(angle);
    ctx.translate(labelEdge, 0);
    if (flip) ctx.rotate(Math.PI);
    ctx.font = `600 ${fit.size}px ${FONT}`;
    ctx.fillStyle = token('--wheel-ink');
    ctx.textAlign = flip ? 'left' : 'right';
    ctx.textBaseline = 'middle';
    fit.lines.forEach((line, i) => ctx.fillText(line, 0, (i - (fit.lines.length - 1) / 2) * fit.lineH));
    ctx.restore();
  }
  ctx.restore();

  ring(face, 1, token('--wheel-edge'));
  disk(49, token('--wheel-hub'));
  ring(49, 1.5, token('--wheel-edge'));
  ctx.restore();
}

const CROSS = '<svg class="icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>';
const grow = el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };

function renderRows() {
  const rows = $('rows');
  rows.innerHTML = '';
  state.items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span class="word">
        <span class="dot" aria-hidden="true" style="background:var(${WEDGES[wedge(i)]})"></span>
        <textarea rows="1" name="woord" autocomplete="off" maxlength="120" placeholder="Woord of zin" aria-label="Woord"></textarea>
      </span>
      <span class="weight">
        <button type="button" data-d="-1" aria-label="Gewicht omlaag">−</button>
        <input type="number" name="gewicht" autocomplete="off" min="0" step="1" inputmode="decimal" aria-label="Gewicht">
        <button type="button" data-d="1" aria-label="Gewicht omhoog">+</button>
      </span>
      <span class="pct"></span>
      <button type="button" class="del" aria-label="Verwijder woord" aria-haspopup="dialog">${CROSS}</button>`;
    const text = row.querySelector('textarea'), num = row.querySelector('input');
    text.value = it.t;
    num.value = it.w;
    text.oninput = () => {
      if (/[\r\n]/.test(text.value)) text.value = text.value.replace(/[\r\n]+/g, ' ');
      it.t = text.value; grow(text); changed();
    };
    text.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); text.blur(); } };
    num.oninput = () => { it.w = Math.max(0, Number(num.value) || 0); changed(); };
    row.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
      it.w = Math.max(0, Math.round((it.w + Number(b.dataset.d)) * 100) / 100);
      num.value = it.w; changed();
    });
    row.querySelector('.del').onclick = () => {
      pendingDelete = it;
      $('delete-word').textContent = it.t.trim() || 'Leeg woord';
      deleteDialog.returnValue = '';
      deleteDialog.showModal();
    };
    rows.appendChild(row);
    grow(text);
  });
  updatePct();
}
deleteDialog.addEventListener('close', () => {
  const index = state.items.indexOf(pendingDelete);
  pendingDelete = null;
  if (index < 0) return;

  if (deleteDialog.returnValue === 'delete') {
    state.items.splice(index, 1);
    renderRows();
    changed();
  }

  const rows = $('rows');
  const next = rows.children[Math.min(index, rows.children.length - 1)];
  (next?.querySelector('.del') || $('add')).focus();
});

function updatePct() {
  const total = state.items.reduce((s, it) => s + it.w, 0);
  document.querySelectorAll('#rows .pct').forEach((el, i) => {
    const p = total ? state.items[i].w / total * 100 : 0;
    el.textContent = (p >= 10 || p === 0 ? p.toFixed(0) : p.toFixed(1)) + '%';
  });
  const empty = !active().length;
  spinButton.disabled = empty;
  stage.toggleAttribute('data-empty', empty);
  if (result.classList.contains('idle')) {
    const message = empty ? 'Voeg een woord met gewicht toe.' : '';
    if (result.textContent !== message) result.textContent = message;
  }
}

function stopSpin() {
  cancelAnimationFrame(spinFrame);
  spinFrame = 0;
  angularVelocity = 0;
  stage.removeAttribute('data-spinning');
  spinButton.textContent = 'Draai';
}

function changed() {
  if (spinFrame) {
    stopSpin();
    rot %= TAU;
    result.className = 'idle';
    result.textContent = '';
  }
  selected = null;
  save();
  updatePct();
  draw();
}

function spin() {
  const sl = slices();
  if (!sl.length) return;

  // De gewichten bepalen de winnaar, ook als de vakken even groot zijn.
  let x = Math.random() * sl.reduce((sum, slice) => sum + slice.w, 0);
  const win = sl.find(slice => (x -= slice.w) < 0) || sl[sl.length - 1];
  const point = win.start + (win.end - win.start) * (0.15 + Math.random() * 0.7);
  const distance = ((-Math.PI / 2 - point - rot) % TAU + TAU) % TAU +
    TAU * (5 + Math.floor(Math.random() * 2));
  const target = rot + distance;
  const rate = TAU / 3.55;
  const initialVelocity = spinFrame ? angularVelocity : rate * distance * 0.4;
  const response = initialVelocity - rate * distance;

  if (spinFrame) cancelAnimationFrame(spinFrame);
  else if (selected !== null) {
    selected = null;
    draw();
  }
  stage.setAttribute('data-spinning', '');
  spinButton.textContent = 'Draai opnieuw';
  result.className = 'is-spinning';
  result.textContent = 'Het rad draait…';

  function finish() {
    stopSpin();
    rot = target % TAU;
    result.className = '';
    result.textContent = win.t.trim() || 'Leeg woord';
    if (state.remove) {
      state.items[win.i].w = 0;
      renderRows();
      save();
    } else {
      selected = win.i;
    }
    draw();
    updatePct();
  }

  if (REDUCED.matches) {
    finish();
    return;
  }

  const start = performance.now();
  angularVelocity = initialVelocity;
  function frame(now) {
    const seconds = (now - start) / 1000;
    const decay = Math.exp(-rate * seconds);
    const error = (response * seconds - distance) * decay;
    angularVelocity = (initialVelocity - rate * response * seconds) * decay;
    if (REDUCED.matches || (Math.abs(error) < 0.004 && Math.abs(angularVelocity) < 0.02)) {
      finish();
      return;
    }
    rot = target + error;
    canvas.style.transform = 'rotate(' + (rot - paintedRotation) + 'rad)';
    spinFrame = requestAnimationFrame(frame);
  }
  spinFrame = requestAnimationFrame(frame);
}

spinButton.onclick = spin;
canvas.onclick = spin;
$('add').onclick = () => {
  state.items.push({ t: '', w: 1 }); renderRows(); changed();
  const inputs = document.querySelectorAll('#rows textarea');
  inputs[inputs.length - 1].focus();
};
$('reset').onclick = () => { state.items.forEach(it => it.w = 1); renderRows(); changed(); };
let shareTimer;
$('share').onclick = async () => {
  const hash = save();
  const url = location.protocol === 'file:'
    ? 'https://jappelflappel.github.io/rad-van-fortuin/' + hash
    : location.href;
  const button = $('share');
  const label = $('share-label');
  try {
    await navigator.clipboard.writeText(url);
    label.textContent = 'Link gekopieerd';
    button.setAttribute('data-copied', '');
    clearTimeout(shareTimer);
    shareTimer = setTimeout(() => {
      label.textContent = 'Kopieer link';
      button.removeAttribute('data-copied');
    }, 1800);
  } catch {
    prompt('Kopieer deze link:', url);
  }
};
$('equal').checked = state.equal;
$('remove').checked = state.remove;
$('settings').open = state.equal || state.remove;
$('equal').onchange = e => { state.equal = e.target.checked; changed(); };
$('remove').onchange = e => { state.remove = e.target.checked; save(); };

const growRows = () => document.querySelectorAll('#rows textarea').forEach(grow);
renderRows();
draw();
addEventListener('resize', growRows);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
</script>
</body>
</html>
