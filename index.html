<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rad van Fortuin</title>
<meta name="description" content="Een rad van fortuin waarbij je per woord het gewicht instelt en het rad met een link deelt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="container">
    <h1>Rad van Fortuin</h1>
    <button type="button" class="btn" id="share">Kopieer deellink</button>
  </div>
</header>

<main class="container screen">
  <section class="stage" aria-label="Het rad">
    <div class="outcome">
      <p class="figure" id="result" aria-live="polite">Draai het rad</p>
      <button type="button" class="btn btn--primary" id="spin">Draai!</button>
    </div>
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="1000" height="1000" aria-label="Rad van fortuin"></canvas>
    </div>
  </section>

  <section class="card" aria-label="Woorden en gewichten">
    <p class="note">Hoger gewicht = grotere kans. Gewicht 0 doet niet mee.</p>
    <div class="head"><span></span><span>Woord</span><span class="c">Gewicht</span><span class="r">Kans</span><span></span></div>
    <div id="rows"></div>
    <div class="actions">
      <button type="button" class="btn" id="add">+ Woord</button>
      <button type="button" class="btn btn--text" id="reset">Gewichten naar 1</button>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="equal"> Toon alle vakken even groot (gewichten verborgen)</label>
      <label><input type="checkbox" id="remove"> Zet winnaar na het draaien op gewicht 0</label>
    </div>
    <p class="note">Alles wordt automatisch bewaard in deze browser. Met de deellink opent iemand anders het rad met precies dezelfde woorden en gewichten.</p>
  </section>
</main>

<script>
const KEY = 'rad-van-fortuin-v1';
const DEFAULT = { items: [
  {t:'Pizza',w:3},{t:'Sushi',w:2},{t:'Pasta',w:2},{t:'Burger',w:1},{t:'Salade',w:1},{t:'Friet',w:1}
], equal:false, remove:false };

// Kleuren en letters komen uit de tokens in tokens.css
const css = getComputedStyle(document.documentElement);
const token = n => css.getPropertyValue(n).trim();
const WEDGES = [1,2,3,4,5,6,7,8].map(n => token('--wheel-' + n));
const DARK = [false, true, false, true, false, true, false, true];
const INK = token('--color-ink'), CARD_INK = token('--color-card-ink');
const PAPER = token('--color-paper'), RIM = token('--color-paper-3'), HUB = token('--color-card');
const DISPLAY = token('--font-display');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

let state = load();
let rot = 0, spinning = false;

const $ = id => document.getElementById(id);
const canvas = $('wheel'), ctx = canvas.getContext('2d');

// Laatste vak krijgt een andere kleur als het anders naast dezelfde kleur zou liggen
function wedge(i) {
  const n = state.items.length;
  return n > 1 && i === n - 1 && i % 8 === 0 ? 2 : i % 8;
}

function clean(s) {
  if (!s || !Array.isArray(s.items)) return null;
  return {
    items: s.items.slice(0, 200).map(i => ({ t: String(i.t ?? '').slice(0, 60), w: Math.max(0, Number(i.w) || 0) })),
    equal: !!s.equal, remove: !!s.remove
  };
}
function load() {
  try {
    if (location.hash.startsWith('#d=')) {
      const s = clean(JSON.parse(decodeURIComponent(location.hash.slice(3))));
      if (s) return s;
    }
  } catch {}
  try { const s = clean(JSON.parse(localStorage.getItem(KEY))); if (s) return s; } catch {}
  return structuredClone(DEFAULT);
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  try { history.replaceState(null, '', '#d=' + encodeURIComponent(JSON.stringify(state))); } catch {}
}

// Actieve vakken: alleen woorden met gewicht > 0
function active() {
  return state.items.map((it, i) => ({ ...it, i })).filter(it => it.w > 0);
}
function slices() {
  const a = active();
  const total = a.reduce((s, it) => s + (state.equal ? 1 : it.w), 0);
  let at = 0;
  return a.map(it => {
    const size = (state.equal ? 1 : it.w) / total * Math.PI * 2;
    const s = { ...it, start: at, end: at + size };
    at += size;
    return s;
  });
}

function draw() {
  const R = 500, r = 474;
  ctx.clearRect(0, 0, 1000, 1000);
  const sl = slices();
  ctx.beginPath(); ctx.arc(R, R, 494, 0, Math.PI * 2); ctx.fillStyle = RIM; ctx.fill();
  ctx.save();
  ctx.translate(R, R);
  ctx.rotate(rot);
  for (const s of sl) {
    const w = wedge(s.i);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, s.start, s.end); ctx.closePath();
    ctx.fillStyle = WEDGES[w]; ctx.fill();
    if (sl.length > 1) { ctx.strokeStyle = RIM; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.stroke(); }
    // Tekst langs de straal
    const span = s.end - s.start, mid = s.start + span / 2;
    const maxH = Math.min(52, 2 * 300 * Math.sin(Math.min(span, Math.PI) / 2) * 0.8);
    if (maxH < 14) continue;
    ctx.save();
    ctx.rotate(mid);
    ctx.fillStyle = DARK[w] ? INK : CARD_INK; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    let size = maxH, label = s.t || '—';
    const font = () => ctx.font = `800 ${size}px ${DISPLAY}`;
    font();
    const maxW = 310;
    while (ctx.measureText(label).width > maxW && size > 20) { size -= 2; font(); }
    while (ctx.measureText(label).width > maxW && label.length > 2) label = label.slice(0, -2) + '…';
    ctx.fillText(label, r - 48, 0);
    ctx.restore();
  }
  ctx.restore();
  // Naaf
  ctx.beginPath(); ctx.arc(R, R, 50, 0, Math.PI * 2); ctx.fillStyle = RIM; ctx.fill();
  ctx.beginPath(); ctx.arc(R, R, 34, 0, Math.PI * 2); ctx.fillStyle = HUB; ctx.fill();
}

const CROSS = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg>';

function renderRows() {
  const rows = $('rows');
  rows.innerHTML = '';
  state.items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span class="dot" style="background:var(--wheel-${wedge(i) + 1})"></span>
      <input type="text" name="woord" autocomplete="off" maxlength="60" placeholder="Woord" aria-label="Woord">
      <span class="weight">
        <button type="button" data-d="-1" aria-label="Gewicht omlaag">−</button>
        <input type="number" name="gewicht" autocomplete="off" min="0" step="1" inputmode="decimal" aria-label="Gewicht">
        <button type="button" data-d="1" aria-label="Gewicht omhoog">+</button>
      </span>
      <span class="pct"></span>
      <button type="button" class="del" aria-label="Verwijder">${CROSS}</button>`;
    const [text, num] = row.querySelectorAll('input');
    text.value = it.t; num.value = it.w;
    text.oninput = () => { it.t = text.value; changed(); };
    num.oninput = () => { it.w = Math.max(0, Number(num.value) || 0); changed(); };
    row.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
      it.w = Math.max(0, Math.round((it.w + Number(b.dataset.d)) * 100) / 100);
      num.value = it.w; changed();
    });
    row.querySelector('.del').onclick = () => { state.items.splice(i, 1); renderRows(); changed(); };
    rows.appendChild(row);
  });
  updatePct();
}
function updatePct() {
  const total = state.items.reduce((s, it) => s + it.w, 0);
  document.querySelectorAll('#rows .pct').forEach((el, i) => {
    const p = total ? state.items[i].w / total * 100 : 0;
    el.textContent = (p >= 10 || p === 0 ? p.toFixed(0) : p.toFixed(1)) + '%';
  });
  $('spin').disabled = spinning || !active().length;
}
function changed() { save(); updatePct(); draw(); }

function spin() {
  if (spinning) return;
  const sl = slices();
  if (!sl.length) return;
  // Winnaar kiezen op basis van gewicht (los van hoe groot het vak getekend is)
  let x = Math.random() * sl.reduce((s, it) => s + it.w, 0);
  const win = sl.find(s => (x -= s.w) < 0) || sl[sl.length - 1];
  const span = win.end - win.start;
  const target = win.start + span * (0.1 + Math.random() * 0.8);
  const TAU = Math.PI * 2;
  let delta = ((-Math.PI / 2 - target - rot) % TAU + TAU) % TAU;
  delta += TAU * (5 + Math.floor(Math.random() * 3));
  const from = rot, dur = REDUCED ? 1 : 5500, t0 = performance.now();
  spinning = true; $('result').classList.add('is-spinning'); updatePct();
  (function frame(now) {
    const t = Math.min(1, (now - t0) / dur);
    rot = from + delta * (1 - Math.pow(1 - t, 4));
    draw();
    if (t < 1) return requestAnimationFrame(frame);
    rot %= TAU; spinning = false;
    $('result').textContent = win.t || '—';
    $('result').classList.remove('is-spinning');
    if (state.remove) { state.items[win.i].w = 0; renderRows(); save(); draw(); }
    updatePct();
  })(t0 + 1);
}

$('spin').onclick = spin;
canvas.onclick = spin;
$('add').onclick = () => {
  state.items.push({ t: '', w: 1 }); renderRows(); changed();
  const inputs = document.querySelectorAll('#rows input[type=text]');
  inputs[inputs.length - 1].focus();
};
$('reset').onclick = () => { state.items.forEach(it => it.w = 1); renderRows(); changed(); };
$('share').onclick = async () => {
  save();
  const b = $('share');
  try { await navigator.clipboard.writeText(location.href); b.textContent = 'Link gekopieerd'; }
  catch { prompt('Kopieer deze link:', location.href); }
  setTimeout(() => b.textContent = 'Kopieer deellink', 1800);
};
$('equal').checked = state.equal; $('remove').checked = state.remove;
$('equal').onchange = e => { state.equal = e.target.checked; changed(); };
$('remove').onchange = e => { state.remove = e.target.checked; changed(); };

renderRows(); draw();
if (document.fonts) document.fonts.ready.then(draw);
</script>
</body>
</html>
